name: release

# Monta o Ombro.app (Apple Silicon) e o DMG com assinatura ad-hoc. Detalhes: docs/distribution.md.
#
#   - tag v* (ex.: v0.9.0-beta.1): testa, monta, confere e cria um RASCUNHO de release com o DMG e o SHA256SUMS.
#     Publicar o rascunho é sempre uma ação manual.
#   - manual (workflow_dispatch): testa, monta e guarda o DMG como artefato do run (sem release).
#
# Sem Developer ID e sem notarização: o workflow não usa nenhum secret, só o GITHUB_TOKEN, e só o job que cria o
# rascunho tem permissão de escrita. Pull requests nunca disparam este workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Testar e montar (macOS Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
      pre: ${{ steps.versao.outputs.pre }}
      dmg: ${{ steps.dmg.outputs.nome }}
    steps:
      - uses: actions/checkout@v5

      - name: Versão (a tag, o app, o Cargo.toml e o backend precisam bater)
        id: versao
        run: |
          app=$(node -p "require('./app/package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' app/src-tauri/Cargo.toml | head -1)
          backend=$(sed -n 's/^VERSAO = "\(.*\)".*/\1/p' ombro/__init__.py)
          [ "$app" = "$cargo" ] || { echo "::error::package.json ($app) e Cargo.toml ($cargo) diferentes"; exit 1; }
          [ "$app" = "$backend" ] || { echo "::error::package.json ($app) e ombro/__init__.py ($backend) diferentes"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "${GITHUB_REF_NAME#v}" != "$app" ]; then
            echo "::error::a tag $GITHUB_REF_NAME não bate com a versão do app ($app)"; exit 1
          fi
          echo "versao=$app" >> "$GITHUB_OUTPUT"
          [[ "$app" == *-* ]] && echo "pre=true" >> "$GITHUB_OUTPUT" || echo "pre=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Rust estável
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Dependências
        run: |
          python -m pip install -r requirements.txt
          cd app && npm ci

      # o mesmo que o tests.yml e o app.yml conferem: uma tag com testes quebrados não vira release
      - name: Testes do backend (Python)
        run: python -m unittest discover -s tests -t .
      - name: Tipos e testes da interface
        working-directory: app
        run: npm run typecheck && npm test
      - name: Testes do Rust
        working-directory: app
        run: npm run build && cd src-tauri && cargo test --locked

      - name: Backend embarcado (runtime Python, dependências, código do Ombro), assinatura ad-hoc
        run: python -I app/scripts/build_backend.py --sign -

      - name: Ombro.app e DMG (assinatura ad-hoc do tauri.release.conf.json)
        working-directory: app
        run: |
          # sem a pasta do runner nos caminhos que o Rust grava no binário
          export RUSTFLAGS="--remap-path-prefix=$HOME=~"
          npx tauri build --config src-tauri/tauri.release.conf.json --bundles app,dmg

      - name: Conferir o app (assinatura, versão e conteúdo)
        run: |
          APP=app/src-tauri/target/release/bundle/macos/Ombro.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -q '^Signature=adhoc' || { echo "::error::a assinatura não é ad-hoc"; exit 1; }
          v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          [ "$v" = "${{ steps.versao.outputs.versao }}" ] || { echo "::error::Info.plist com a versão $v"; exit 1; }
          # sem dados locais, sem a biblioteca GPL da tela, sem a pasta de quem montou
          ruins=$(find "$APP" \( -name '*.db' -o -name 'config.json' -o -name '.env' -o -name '*.log' -o -name 'uso.json' \
                  -o -path '*/library/lcd*' -o -path '*turing-smart-screen*' \) -print)
          [ -z "$ruins" ] || { echo "::error::arquivos que não deveriam estar no app:"; echo "$ruins"; exit 1; }
          # o $HOME do runner só não pode estar no que este build gera: o executável (Rust), o código do Ombro e os
          # avisos (os .pyc do runtime o build_backend.py já conferiu). Binários de terceiros (CPython, Pillow, numpy…)
          # trazem /Users/runner da máquina de build deles, que também são runners do GitHub.
          GERADOS=("$APP/Contents/MacOS" "$APP/Contents/Resources/backend" "$APP/Contents/Resources/licenses/THIRD_PARTY_NOTICES.md")
          if grep -rlF "$HOME" "${GERADOS[@]}" > /dev/null; then
            echo "::error::arquivos com $HOME:"; grep -rlF "$HOME" "${GERADOS[@]}" | head -20; exit 1
          fi
          test -f "$APP/Contents/Resources/licenses/THIRD_PARTY_NOTICES.md"
          test -f "$APP/Contents/Resources/licenses/OMBRO-LICENSE.txt"
          # ad-hoc: o Gatekeeper recusa um app sem notarização; é o esperado (a primeira abertura é autorizada à mão)
          spctl --assess --type execute -vv "$APP" 2>&1 || true

      - name: DMG com nome da versão e da arquitetura, e SHA256SUMS
        id: dmg
        run: |
          mkdir -p dist-release
          NOME="Ombro-v${{ steps.versao.outputs.versao }}-macos-arm64.dmg"
          cp app/src-tauri/target/release/bundle/dmg/*.dmg "dist-release/$NOME"
          hdiutil verify "dist-release/$NOME"
          (cd dist-release && shasum -a 256 "$NOME" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "nome=$NOME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ombro-macos-arm64
          path: dist-release/
          retention-days: 14
          if-no-files-found: error

  draft-release:
    name: Rascunho da release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # só para criar o rascunho da release
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ombro-macos-arm64
          path: dist-release
      - name: Criar o rascunho (pré-release quando a versão tem "-")
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSAO: ${{ needs.build.outputs.versao }}
          DMG: ${{ needs.build.outputs.dmg }}
          PRE: ${{ needs.build.outputs.pre }}
        run: |
          SHA=$(cut -d' ' -f1 dist-release/SHA256SUMS.txt)
          cat > "$RUNNER_TEMP/notas.md" <<EOF
          Ombro $VERSAO para macOS: Apple Silicon (M1 ou mais novo), macOS 13 ou mais novo.

          ## Instalar
          1. Baixe \`$DMG\` e, se quiser, o \`SHA256SUMS.txt\`.
          2. Abra o DMG e arraste o **Ombro** para **Aplicativos**.
          3. Abra o Ombro pela pasta Aplicativos.

          ## Primeira abertura
          Esta versão tem **assinatura ad-hoc** e **não é notarizada pela Apple** (o projeto não usa Developer ID).
          Na primeira vez, o macOS avisa que não pôde verificar o app. Se você confia na origem: feche o aviso e, em
          **Ajustes do Sistema > Privacidade e Segurança**, clique em **Abrir Mesmo Assim** ao lado do Ombro
          (como a Apple explica em https://support.apple.com/pt-br/102445). Macs gerenciados pela empresa podem não permitir.
          Passo a passo: https://github.com/$GH_REPO/blob/$GITHUB_REF_NAME/docs/macos-installation.md

          ## Conferir o download
          SHA-256 de \`$DMG\`: \`$SHA\`

          \`\`\`
          shasum -a 256 -c SHA256SUMS.txt
          \`\`\`

          ## Limitações conhecidas
          Veja a seção "Limitações da beta" do README: https://github.com/$GH_REPO/blob/$GITHUB_REF_NAME/README.md
          EOF
          FLAGS=(--draft --verify-tag --title "Ombro $VERSAO" --notes-file "$RUNNER_TEMP/notas.md")
          [ "$PRE" = "true" ] && FLAGS+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${FLAGS[@]}" "dist-release/$DMG" dist-release/SHA256SUMS.txt
