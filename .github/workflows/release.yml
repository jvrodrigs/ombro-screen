name: release

# Monta o Ombro.app (Apple Silicon) e o DMG. Detalhes, secrets e como recuperar uma versão: docs/distribution.md.
#
#   - tag v* (ex.: v0.5.0-alpha.1): monta, assina e notariza se os secrets existirem, e cria um RASCUNHO de release
#     com o DMG e o SHA256SUMS. Publicar o rascunho é sempre uma ação manual.
#   - manual (workflow_dispatch): só monta e guarda o DMG como artefato do run (sem release).
#
# Pull requests nunca disparam este workflow: código de fora não chega perto dos certificados. Os secrets ficam
# no environment "release" (Settings > Environments), que deve aceitar só tags v*.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign:
        description: "Assinar e notarizar (precisa dos secrets do environment release)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write # só para criar o rascunho da release
    env:
      ASSINAR: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.sign }}
    steps:
      - uses: actions/checkout@v5

      - name: Versão (a tag, o package.json e o Cargo.toml precisam bater)
        id: versao
        run: |
          app=$(node -p "require('./app/package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' app/src-tauri/Cargo.toml | head -1)
          [ "$app" = "$cargo" ] || { echo "::error::package.json ($app) e Cargo.toml ($cargo) diferentes"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "${GITHUB_REF_NAME#v}" != "$app" ]; then
            echo "::error::a tag $GITHUB_REF_NAME não bate com a versão do app ($app)"; exit 1
          fi
          echo "versao=$app" >> "$GITHUB_OUTPUT"
          [[ "$app" == *-* ]] && echo "pre=true" >> "$GITHUB_OUTPUT" || echo "pre=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Rust estável
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Dependências da interface
        working-directory: app
        run: npm ci

      - name: Certificado Developer ID (keychain temporário)
        id: cert
        if: env.ASSINAR == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::sem APPLE_CERTIFICATE: a build sai com assinatura ad-hoc, SEM notarização (o Gatekeeper vai recusar)"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/ombro-assinatura.keychain-db"
          SENHA=$(openssl rand -base64 32)
          echo "::add-mask::$SENHA"
          security create-keychain -p "$SENHA" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$SENHA" "$KEYCHAIN"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$SENHA" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [ -n "$ID" ] || { echo "::error::o certificado não tem uma identidade Developer ID Application"; exit 1; }
          echo "identidade=$ID" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"

      - name: Backend embarcado (runtime Python, dependências, código do Ombro)
        run: python -I app/scripts/build_backend.py --sign "${IDENTIDADE:--}"
        env:
          IDENTIDADE: ${{ steps.cert.outputs.identidade }}

      - name: Ombro.app e DMG
        working-directory: app
        env:
          IDENTIDADE: ${{ steps.cert.outputs.identidade }}
          # notarização: chave de API do App Store Connect (preferida) ou Apple ID; sem elas, o Tauri não notariza
          APPLE_API_ISSUER: ${{ steps.cert.outputs.identidade && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ steps.cert.outputs.identidade && secrets.APPLE_API_KEY || '' }}
          APPLE_API_PRIVATE_KEY: ${{ steps.cert.outputs.identidade && secrets.APPLE_API_PRIVATE_KEY || '' }}
          APPLE_ID: ${{ steps.cert.outputs.identidade && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ steps.cert.outputs.identidade && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.cert.outputs.identidade && secrets.APPLE_TEAM_ID || '' }}
        run: |
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          fi
          unset APPLE_API_PRIVATE_KEY
          [ -n "$APPLE_API_ISSUER" ] || unset APPLE_API_ISSUER APPLE_API_KEY
          [ -n "$APPLE_ID" ] || unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          # a identidade vai por um config a mais, por cima do "-" (ad-hoc) do tauri.release.conf.json
          printf '{"bundle":{"macOS":{"signingIdentity":%s}}}' "$(node -p 'JSON.stringify(process.env.IDENTIDADE || "-")')" > "$RUNNER_TEMP/assinatura.json"
          npx tauri build --config src-tauri/tauri.release.conf.json --config "$RUNNER_TEMP/assinatura.json" --bundles app,dmg
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Conferir a assinatura (e, se assinado, o Gatekeeper)
        id: conferir
        run: |
          APP=app/src-tauri/target/release/bundle/macos/Ombro.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ -n "${{ steps.cert.outputs.identidade }}" ]; then
            spctl --assess --type execute -vv "$APP"
            xcrun stapler validate "$APP" && echo "estado=assinado e notarizado" >> "$GITHUB_OUTPUT" || echo "estado=assinado, SEM notarização" >> "$GITHUB_OUTPUT"
          else
            echo "estado=ad-hoc (sem Developer ID nem notarização)" >> "$GITHUB_OUTPUT"
          fi

      - name: DMG com nome da arquitetura e SHA256SUMS
        id: dmg
        run: |
          mkdir -p dist-release
          NOME="Ombro-${{ steps.versao.outputs.versao }}-macos-arm64.dmg"
          cp app/src-tauri/target/release/bundle/dmg/*.dmg "dist-release/$NOME"
          (cd dist-release && shasum -a 256 "$NOME" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "nome=$NOME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ombro-macos-arm64
          path: dist-release/
          retention-days: 14

      - name: Rascunho da release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; [ "${{ steps.versao.outputs.pre }}" = "true" ] && PRE="--prerelease"
          cat > "$RUNNER_TEMP/notas.md" <<EOF
          Ombro ${{ steps.versao.outputs.versao }} para macOS (Apple Silicon, macOS 13 ou mais novo).

          Assinatura: ${{ steps.conferir.outputs.estado }}.
          Instalação e verificação do download: docs/macos-installation.md.
          EOF
          gh release create "$GITHUB_REF_NAME" --draft $PRE --title "Ombro ${{ steps.versao.outputs.versao }}" \
            --notes-file "$RUNNER_TEMP/notas.md" "dist-release/${{ steps.dmg.outputs.nome }}" dist-release/SHA256SUMS.txt

      - name: Apagar o keychain temporário
        if: always() && steps.cert.outputs.keychain != ''
        run: security delete-keychain "${{ steps.cert.outputs.keychain }}"
